{{/*
  travelpath-styles.html — CSS owned by the Travelpath plugin alone.
  Shared CSS lives in geo-core-v1.html and geo-media-styles-v1.html.
  Every class here carries the mb-tp- prefix, including the cluster
  bubbles, which used to share a class with Maps. No !important.
*/}}

<style>
/* Map container. Height arrives as the --mb-map-h custom property from
   the shortcode. */
.mb-tp-map,
article .mb-tp-map {
  position: relative;
  z-index: 0;
  width: 100%;
  height: var(--mb-map-h, 500px);
  border-radius: 12px;
  margin: 30px 0;
}
/* The tile grid sits directly below: square off the bottom corners. */
.mb-tp-map--joined,
article .mb-tp-map--joined {
  border-radius: 12px 12px 0 0;
  margin: 30px 0 0;
}

/* ── Travelpath: Tile Grid ── */
.mb-tp-grid {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin-top: 0;
  background: #f0f0f0;
  border-radius: 0 0 12px 12px;
  padding: 10px 12px;
}

.mb-tp-tile {
  height: 44px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  margin: 0;
  border: none;
  user-select: none;
  box-sizing: border-box;
  line-height: 1;
  appearance: none;
  -webkit-appearance: none;
  white-space: nowrap;
}

.mb-tp-tile--segment,
.mb-tp-tile--legend,
.mb-tp-tile--hub,
.mb-tp-tile--stat,
article .mb-tp-tile--segment,
article .mb-tp-tile--legend,
article .mb-tp-tile--hub,
article .mb-tp-tile--stat {
  background-color: var(--tile-color, #3b82f6);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}

.mb-tp-tile--segment:hover,
.mb-tp-tile--segment:focus-visible,
.mb-tp-tile--legend:hover,
.mb-tp-tile--legend:focus-visible,
.mb-tp-tile--hub:hover,
.mb-tp-tile--hub:focus-visible,
.mb-tp-tile--stat:hover,
.mb-tp-tile--stat:focus-visible {
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,.22);
  opacity: .88;
  outline: none;
}

.mb-tp-tile--segment:active,
.mb-tp-tile--legend:active,
.mb-tp-tile--hub:active,
.mb-tp-tile--stat:active {
  transform: translateY(0);
  box-shadow: 0 1px 2px rgba(0,0,0,.18);
}

.mb-tp-tile-sep {
  width: 10px;
  height: 44px;
  flex-shrink: 0;
}

.mb-tp-tile-arrow {
  color: #999;
  font-size: 18px;
  font-weight: 700;
  line-height: 44px;
  flex-shrink: 0;
  user-select: none;
  pointer-events: none;
}

/* Mobile */
@media (max-width: 480px) {
  .mb-tp-tile {
    height: 38px;
    font-size: 13px;
    padding: 0 10px;
  }
  .mb-tp-tile-sep { height: 38px; }
  .mb-tp-grid { gap: 4px; padding: 8px 10px; }
  .mb-tp-tile-arrow { font-size: 16px; line-height: 38px; }
}

/* ── Travelpath: Popups ── */
.mb-tp-popup-note { color: #444; }
.mb-tp-popup-key { margin: 0 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #999; }

.mb-tp-popup-stats {
  margin: 10px 0 0;
  padding: 8px 0 0;
  border-top: 1px solid #eee;
  font-size: 12px;
  color: #888;
  line-height: 1.8;
}

.mb-tp-popup-divider {
  display: block;
  height: 0;
  border: none;
  border-top: 1px solid #eee;
  margin: 10px 0 12px;
}

.mb-tp-popup-list {
  margin: 0 0 14px;
  padding: 0;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 10px;
  max-height: 220px;
  overflow-y: auto;
  font-size: 13px;
  color: #444;
}

.mb-tp-popup-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  padding: 0 9px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  color: #fff;
  background: #555;
  letter-spacing: .04em;
  flex-shrink: 0;
}

/* ── Cluster bubbles ── */
.mb-tp-cluster {
  background: #4682B4;
  border: 2px solid #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.mb-tp-cluster span {
  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;
  color: #fff;
  font-size: 13px;
}

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  .mb-tp-grid { background: #1e1e1e; }
  .mb-tp-tile-arrow { color: #555; }
  .mb-tp-popup-note { color: #bbb; }
  .mb-tp-popup-key { color: #666; }
  .mb-tp-popup-stats {
    color: #666;
    border-top-color: #333;
  }
  .mb-tp-popup-divider { border-top-color: #333; }
  .mb-tp-popup-list { color: #bbb; }
  .mb-tp-cluster { background: #5a9fd4; border-color: #444; }
}
</style>
